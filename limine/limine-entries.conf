# Additional boot menu entries: (should be set here) 
# sudo ~/.src/hyprdori/limine/install.sh --scan prints entries for the other systems found;
# after a change: sudo ~/.src/hyprdori/limine/install.sh --theme

# Menu options, only here above the first entry; Hyprdori's otherwise: 3 s, the menu shown, the
# first kernel by default. Each takes only its value: a note after it goes on its own line.
# With quiet the menu is hidden, and a key during the timeout shows it; remember_last_entry
# starts what was chosen last; default_entry is Arch Linux/ and a kernel's name.
# timeout: 1
# quiet: yes
# remember_last_entry: yes
# default_entry: Arch Linux/linux-lts

# /Windows
#     protocol: efi
#     path: guid(PARTUUID-OF-ITS-ESP):/EFI/Microsoft/Boot/bootmgfw.efi
#
# /UEFI Shell
#     protocol: efi
#     path: boot():/EFI/tools/shellx64.efi
